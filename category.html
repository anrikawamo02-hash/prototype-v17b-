<!DOCTYPE html>
<html lang="ja" data-page="category">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カテゴリ一覧</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <a id="back_to_index" href="index.html" class="btn backBtn">＜ 戻る</a>
</header>

<main>

  <!-- 母体デザインどおりのタイトル -->
  <h1 id="cat_title" class="title-jp"></h1>
  <h2 id="cat_sub" class="title-en"></h2>

  <!-- ★ メインルームのカテゴリ（app.js が自動生成） -->
  <div id="main_dynamic"></div>

  <!-- ★ ここから固定の6カテゴリ（キッチン・洗面など） -->
  <div class="list">

    <a id="kitchen_link" class="btn">
      <div class="cat">
        <div class="icon">🍳</div>
        <div>
          <div class="jp">キッチン</div>
          <div class="en">Kitchen</div>
        </div>
      </div>
      <div class="chev">›</div>
    </a>

    <a id="vanity_link" class="btn">
      <div class="cat">
        <div class="icon">🪥</div>
        <div>
          <div class="jp">洗面</div>
          <div class="en">Vanity</div>
        </div>
      </div>
      <div class="chev">›</div>
    </a>

    <a id="bath_link" class="btn">
      <div class="cat">
        <div class="icon">🛁</div>
        <div>
          <div class="jp">バスルーム</div>
          <div class="en">Bath</div>
        </div>
      </div>
      <div class="chev">›</div>
    </a>

    <a id="toilet_link" class="btn">
      <div class="cat">
        <div class="icon">🚽</div>
        <div>
          <div class="jp">トイレ</div>
          <div class="en">Toilet</div>
        </div>
      </div>
      <div class="chev">›</div>
    </a>

    <a id="closet_link" class="btn">
      <div class="cat">
        <div class="icon">👕</div>
        <div>
          <div class="jp">クローゼット</div>
          <div class="en">Closet</div>
        </div>
      </div>
      <div class="chev">›</div>
    </a>

    <a id="entrance_link" class="btn">
      <div class="cat">
        <div class="icon">🚪</div>
        <div>
          <div class="jp">玄関</div>
          <div class="en">Entrance</div>
        </div>
      </div>
      <div class="chev">›</div>
    </a>

  </div>

</main>

<script src="app.js"></script>
</body>
</html>
