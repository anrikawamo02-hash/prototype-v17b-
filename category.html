<!DOCTYPE html>
<html lang="ja" data-page="category">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>カテゴリ一覧</title>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,600;0,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=1">
  <script defer src="app.js?v=1"></script>
</head>
<body>
  <div class="app">

    <main>

      <!-- 戻る（indexに戻る） -->
      <a id="back_to_index" class="backLink" href="index.html">
        <span class="icon">‹</span> 戻る
      </a>

      <!-- タイトル（部屋ごとに app.js がここを書き換える） -->
      <div class="titles">
        <div id="cat_title" class="j">お部屋｜カテゴリ</div>
        <div id="cat_sub" class="e">Categories</div>
      </div>

      <!-- メインルーム（5・6号室など、部屋ごとのメインルームカード） -->
      <div id="main_dynamic" class="list"></div>

      <!-- 基本カテゴリ一覧 -->
      <div class="list">

        <!-- キッチン -->
        <a id="kitchen_link" class="btn" href="#">
          <div class="cat">
            <div class="icon">🍳</div>
            <div>
              <div class="jp">キッチン</div>
              <div class="en">Kitchen</div>
            </div>
          </div>
          <div class="chev">›</div>
        </a>

        <!-- 洗面 -->
        <a id="vanity_link" class="btn" href="#">
          <div class="cat">
            <div class="icon">🪥</div>
            <div>
              <div class="jp">洗面</div>
              <div class="en">Vanity</div>
            </div>
          </div>
          <div class="chev">›</div>
        </a>

        <!-- バスルーム -->
        <a id="bath_link" class="btn" href="#">
          <div class="cat">
            <div class="icon">🛁</div>
            <div>
              <div class="jp">バスルーム</div>
              <div class="en">Bath</div>
            </div>
          </div>
          <div class="chev">›</div>
        </a>

        <!-- トイレ -->
        <a id="toilet_link" class="btn" href="#">
          <div class="cat">
            <div class="icon">🚽</div>
            <div>
              <div class="jp">トイレ</div>
              <div class="en">Toilet</div>
            </div>
          </div>
          <div class="chev">›</div>
        </a>

        <!-- クローゼット -->
        <a id="closet_link" class="btn" href="#">
          <div class="cat">
            <div class="icon">👕</div>
            <div>
              <div class="jp">クローゼット</div>
              <div class="en">Closet</div>
            </div>
          </div>
          <div class="chev">›</div>
        </a>

        <!-- 玄関 -->
        <a id="entrance_link" class="btn" href="#">
          <div class="cat">
            <div class="icon">🚪</div>
            <div>
              <div class="jp">玄関</div>
              <div class="en">Entrance</div>
            </div>
          </div>
          <div class="chev">›</div>
        </a>

      </div>

    </main>

  </div>
</body>
</html>
