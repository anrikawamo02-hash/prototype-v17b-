<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <link href="https://fonts.googleapis.com/css2?family=Arima:wght@400;600;700&display=swap" rel="stylesheet">
</head>

<body style="margin:0; padding:0; font-family:'Arima', serif;">

  <!-- ヘッダー -->
<div style="
  width: 100%;
  background: #DDEEFF;
  padding: 18px 20px 22px;
  border-bottom-left-radius: 20px;
  border-bottom-right-radius: 20px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  text-align: center;
  position: relative;
">
  <!-- タイトル -->
  <h1 style="margin:0; font-size:40px; font-weight:600; color:#333;">
    お部屋一覧
  </h1>

  <p style="margin:6px 0 0; color:#555; font-size:25px;">
    Room list
  </p>

  <!-- 右上アイコン ※任意 -->
  <img 
    src="icon.PNG"
    style="width:130px; position:absolute; right:15px; top:5px;"
  />
</div>

  <!-- 下のコンテンツ例 -->
  <div style="padding:20px;">
    <h2>これはテストアプリだよ！</h2>
    <p>杏里が自由にデザインを作れる場所✨</p>
  </div>
